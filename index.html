<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0f3b" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Placeholder title only. `scripts/prerender.mjs` strips this and injects a
      full per-route head (title, description, canonical, Open Graph, Twitter
      Card, JSON-LD) before the closing head tag. Keeping exactly one title here
      means the built HTML is still valid when opened without prerendering
      (e.g. dev).

      Do NOT spell out tag names in this file's comments. Vite and the
      prerenderer insert content by string-replacing the FIRST closing head tag,
      so a literal copy of that tag in a comment swallows the stylesheet, the
      canonical link and every Open Graph tag into the comment, where the
      browser ignores them. That is not hypothetical - it is exactly what
      happened, and it left the site rendering with no CSS at all.
    -->
    <title>Cornerstone Health Services Inc | Psychiatric Care in Quincy, MA</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Friendly geometric display (Poppins) + warm humanist body (DM Sans). See src/index.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..500&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
